  continue_next_run:
    name: Continue with next 24-hour run
    needs:
      - capture_part1
      - capture_part2
      - capture_part3
      - capture_part4
      - capture_part5
    if: ${{ always() && inputs.auto_continue }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start next capture run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "Starting next polymarket-monthly-rolling-24h run on ${BRANCH}"
          gh workflow run polymarket-monthly-rolling-24h.yml \
            --ref "${BRANCH}" \
            -f auto_continue=true
