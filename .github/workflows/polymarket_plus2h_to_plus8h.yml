name: polymarket-plus2h-to-plus8h

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture_part1:
    runs-on: ubuntu-latest
    timeout-minutes: 305
    concurrency:
      group: polymarket-plus2h-to-plus8h
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait until 2 hours later
        run: |
          echo "Sleeping 7200 seconds before starting capture..."
          sleep 7200

      - name: Capture hours 2 to 5
        run: |
          python polymarket_quotes.py \
            --market-url "https://polymarket.com/zh/event/btc-updown-5m-1776752100" \
            --mode "loop-next-hours" \
            --duration-hours "3" \
            --sample-seconds "1"

      - name: Commit captured data
        run: |
          if [ -n "$(git status --porcelain data debug)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data debug
            git commit -m "Add Polymarket data for hours 2 to 5"
            git push
          else
            echo "No data changes to commit"
          fi

  capture_part2:
    needs: capture_part1
    runs-on: ubuntu-latest
    timeout-minutes: 185
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Capture hours 5 to 8
        run: |
          python polymarket_quotes.py \
            --market-url "https://polymarket.com/zh/event/btc-updown-5m-1776752100" \
            --mode "loop-next-hours" \
            --duration-hours "3" \
            --sample-seconds "1"

      - name: Commit captured data
        run: |
          if [ -n "$(git status --porcelain data debug)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data debug
            git commit -m "Add Polymarket data for hours 5 to 8"
            git push
          else
            echo "No data changes to commit"
          fi
