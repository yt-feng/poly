name: capture-continuity-probe
run-name: continuity-probe ${{ inputs.session || github.run_id }} step ${{ inputs.hop || '1' }}
on:
  push:
    branches: [codex/poly-continuity-20260928]
    paths: ['capture_watchdog_v2.py', 'capture_continuity_probe.py', 'tests/test_capture_continuity.py', '.github/workflows/capture-continuity-probe.yml']
  workflow_dispatch:
    inputs:
      session:
        description: 'Numeric session ID; empty starts a new isolated six-hop chain'
        type: string
        default: ''
      hop:
        description: 'Fixture hop 1..6; never runs a collector or accesses market data'
        type: string
        default: '1'
permissions:
  contents: read
  actions: write
concurrency:
  group: capture-continuity-probe-${{ inputs.session || github.run_id }}
  cancel-in-progress: false
jobs:
  fixture:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: End an isolated fixture workload without market side effects
        env:
          SESSION: ${{ inputs.session || github.run_id }}
          HOP: ${{ inputs.hop || '1' }}
        run: |
          python3 - <<'PY'
          import json, os
          hop = int(os.environ['HOP'])
          assert 1 <= hop <= 6 and os.environ['SESSION'].isdigit()
          print(json.dumps({'session': os.environ['SESSION'], 'hop': hop,
                            'run_id': os.environ['GITHUB_RUN_ID'], 'head_sha': os.environ['GITHUB_SHA'],
                            'market_requests': 0, 'publication_performed': False}))
          PY
  handoff:
    needs: fixture
    if: ${{ always() && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: capture-continuity-probe-dispatch-${{ inputs.session || github.run_id }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SESSION: ${{ inputs.session || github.run_id }}
      HOP: ${{ inputs.hop || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dispatch and acknowledge the next fixture, stopping after six runs
        run: python capture_continuity_probe.py --session "$SESSION" --hop "$HOP"
