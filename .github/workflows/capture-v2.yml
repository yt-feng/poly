name: capture-v2
on:
  push:
    branches: [main]
    paths: ['capture_v2.py', 'capture_runtime_v2.py', '*v3.py', 'market_ws_guard.py', 'archive_v2.py', 'capture_watchdog_v2.py', 'quality_v2.py', 'requirements-v2.txt', 'requirements-test.txt', '.github/workflows/capture-v2.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: capture-v2-production
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    # The collector itself runs for four hours; leave bounded headroom for setup,
    # final checksum/report generation, and retrying durable release uploads.
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CAPTURE_ASSETS: ${{ vars.CAPTURE_ASSETS || 'btc' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Four-hour capture with durable rolling release checkpoints
        run: |
          timeout --signal=INT --kill-after=30s 255m python -u capture_v3.py \
            --assets "$CAPTURE_ASSETS" --seconds 14400 \
            --output capture_v2_output \
            --release "capture-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --require-core
      - name: Preserve diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-v2-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            capture_v2_output/*.json
            capture_v2_output/*.md
          retention-days: 7
      - name: Emergency copy when publication or capture fails
        uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: capture-v2-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: capture_v2_output/
          retention-days: 7
          compression-level: 0

  handoff:
    needs: capture
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    # The watchdog and this final job serialize the same inspect/dispatch decision.
    concurrency:
      group: capture-v2-continuation
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Acknowledge exactly one successor after capture has ended
        run: python capture_watchdog_v2.py --current-run-id "$GITHUB_RUN_ID"
