name: polymarket-current-window-volume-test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: polymarket-current-window-volume-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run current-window capture with volume test
        run: |
          python polymarket_quotes.py \
            --market-url "https://polymarket.com/zh/event/btc-updown-5m-1776752100" \
            --mode "loop-current-window" \
            --sample-seconds "1"

      - name: Commit captured data
        run: |
          if [ -n "$(git status --porcelain data debug)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data debug
            git commit -m "Add current-window Polymarket volume test data"
            git push
          else
            echo "No data changes to commit"
          fi
