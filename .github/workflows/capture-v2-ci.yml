name: capture-v2-ci
on:
  pull_request:
    paths: ['*v2.py', '*v3.py', 'requirements-v2.txt', 'tests/*.py', '.github/workflows/*v2*.yml']
  push:
    branches: ['improve/**']
    paths: ['*v2.py', '*v3.py', 'requirements-v2.txt', 'tests/*.py', '.github/workflows/*v2*.yml']
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-v2.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m py_compile archive_v2.py capture_v2.py quality_v2.py daily_quality_v2.py binance_backfill_v2.py capture_v3.py microstructure_v3.py microstructure_math_v3.py
  live-smoke:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-v2.txt
      - name: Public feeds smoke test, no trading credentials
        run: python -u capture_v3.py --assets btc --seconds 120 --output smoke_v2 --require-core --require-microstructure
      - name: Verify separately labelled Chainlink live observations
        run: python -c 'import json; h=json.load(open("smoke_v2/health.json")); assert h["valid_snapshot_counts"].get("chainlink",0) >= 5, h'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-v2-smoke-${{ github.run_id }}
          path: smoke_v2/
          retention-days: 7
