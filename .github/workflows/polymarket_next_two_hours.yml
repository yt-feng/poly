name: polymarket-next-two-hours

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: polymarket-next-two-hours
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run next two hours capture
        run: |
          python polymarket_quotes.py \
            --market-url "https://polymarket.com/zh/event/btc-updown-5m-1776752100" \
            --mode "loop-next-hours" \
            --duration-hours "2" \
            --sample-seconds "1"

      - name: Commit captured data
        run: |
          if [ -n "$(git status --porcelain data debug)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config pull.rebase true
            git config rebase.autoStash true
            git add data debug
            git commit -m "Add next-two-hours Polymarket captured data" || echo "Nothing to commit"
            for attempt in 1 2 3; do
              git fetch origin main
              git pull --rebase origin main || { git rebase --abort || true; exit 1; }
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Push failed after 3 attempts"
                exit 1
              fi
              sleep 5
            done
          else
            echo "No data changes to commit"
          fi
